server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Never cache the entry document: it is what points at the hashed asset filenames, so a
    # cached index.html is how a browser ends up asking for a bundle that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hashed assets are immutable by construction.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The API is proxied on the same origin, so the browser never makes a cross-origin call
    # and there is no CORS configuration to keep in sync between environments.
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generating three schedules is slow by nature; the client polls a job, but the
        # initial request must not be cut off by an impatient proxy either.
        proxy_read_timeout 120s;
    }

    # Client-side routing: any unknown path is a React route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Modest hardening for a static SPA host.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
