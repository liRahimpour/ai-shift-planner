# Production overrides.

replicaCount: 3

image:
  # Always an explicit, immutable version tag set at deploy time
  # (helm upgrade --set image.tag=v1.0.0). Never `latest`: a rollback has to be a command,
  # not an archaeology exercise.
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: '1'
    memory: 2Gi
  limits:
    # Still no CPU limit: throttling a bursty, CPU-bound solver mid-run is worse than letting
    # it use idle capacity. Memory is capped so one leaking pod cannot take a node down.
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  host: app.ai-shift-planner.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    # Planning is asynchronous, but a large schedule read can still take a while.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  tls:
    enabled: true
    secretName: ai-shift-planner-tls

config:
  springProfilesActive: prod,json-logs
  logLevel: INFO
  scheduling:
    solverSeconds: 60

database:
  # A managed PostgreSQL instance with its own backups and failover - not a pod in this
  # release whose deletion would be a side effect of `helm uninstall`.
  host: CHANGE_ME.postgres.database.azure.com
  port: 5432
  name: ai_shift_planner
  options: "?sslmode=require"

ollama:
  baseUrl: http://ollama.ai.svc.cluster.local:11434
  model: llama3.1
  enabled: true

secrets:
  existingSecret: ai-shift-planner-secrets

migration:
  enabled: true

# Spread replicas across nodes so a single node failure cannot take the whole service with it.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-shift-planner

frontend:
  enabled: true
  replicaCount: 2
