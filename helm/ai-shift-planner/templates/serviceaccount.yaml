{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-shift-planner.serviceAccountName" . }}
  labels:
    {{- include "ai-shift-planner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never calls the Kubernetes API, so it has no use for a mounted API token -
# and a token it does not need is only ever a credential an attacker can find.
automountServiceAccountToken: false
{{- end }}
