{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-shift-planner.frontendName" . }}
  labels:
    {{- include "ai-shift-planner.frontendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-shift-planner.frontendSelectorLabels" . | nindent 4 }}
{{- end }}
