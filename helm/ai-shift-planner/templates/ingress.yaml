{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-shift-planner.fullname" . }}
  labels:
    {{- include "ai-shift-planner.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.frontend.enabled }}
          # API paths are listed FIRST and with an exact prefix. Ingress controllers match
          # the longest prefix, but stating the specific rules before the catch-all keeps the
          # intent readable: everything under /api and /actuator is the backend, everything
          # else is the single-page app.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-shift-planner.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-shift-planner.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-shift-planner.frontendName" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
          {{- else }}
          # Backend-only install: the API is served at the ingress root.
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "ai-shift-planner.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
          {{- end }}
{{- end }}
