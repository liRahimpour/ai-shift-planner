name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant; cancelling it keeps
# feedback fast and stops runners queueing behind work nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp clean compile

      # Unit tests first and separately: they are fast and need no Docker, so a plain logic
      # error is reported in under a minute instead of after the container-based suite.
      - name: Unit tests
        run: ./mvnw -B -ntp test

      # Integration tests use Testcontainers, which needs the Docker daemon that
      # ubuntu-latest already provides. `verify` runs the full suite plus JaCoCo.
      - name: Integration tests and verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      # Builds the image without pushing it. A Dockerfile that stopped building would
      # otherwise only be discovered at release time, when it is most expensive.
      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-shift-planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `install`) so the lockfile is authoritative: CI must build the exact
      # dependency tree a developer had, not whatever the ranges resolve to today.
      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx vite build

      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ai-shift-planner-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: helm lint (default values)
        run: helm lint ./helm/ai-shift-planner

      - name: helm lint (dev values)
        run: helm lint ./helm/ai-shift-planner -f ./helm/ai-shift-planner/values-dev.yaml

      - name: helm lint (prod values)
        run: helm lint ./helm/ai-shift-planner -f ./helm/ai-shift-planner/values-prod.yaml

      # `lint` accepts templates that render to invalid Kubernetes YAML; `template` is what
      # actually proves the manifests come out well-formed.
      - name: helm template renders
        run: |
          helm template ai-shift-planner ./helm/ai-shift-planner \
            -f ./helm/ai-shift-planner/values-prod.yaml > /dev/null
