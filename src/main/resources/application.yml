spring:
  application:
    name: ai-shift-planner
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_shift_planner}
    username: ${DATABASE_USERNAME:ai_shift_planner}
    password: ${DATABASE_PASSWORD:ai_shift_planner}
    hikari:
      pool-name: ai-shift-planner-pool
      # Keep pods responsive under Kubernetes' rolling restarts; a stuck connection should
      # not stall an entire pod.
      connection-timeout: 10000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate - see docs/adr/004.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 25s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY_CHANGE_ME_LOCAL_DEV_ONLY}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:14}
  default-timezone: ${APP_DEFAULT_TIMEZONE:Europe/Berlin}

  ai:
    # The model is never hardcoded in business code - see docs/adr/002.
    enabled: ${AI_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1}
    temperature: ${OLLAMA_TEMPERATURE:0.2}
    # Kept short on purpose: a manager waiting on a chat answer would rather be told the AI
    # is unavailable than watch a spinner.
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:30}
    max-tool-calls-per-conversation: ${AI_MAX_TOOL_CALLS:5}
    minimum-confidence-for-auto-apply: ${AI_MIN_CONFIDENCE:0.85}

  scheduling:
    # Labour-law limits are configuration, never constants in the constraint code - see
    # SchedulingProperties. Defaults below match German ArbZG; override per deployment.
    minimum-rest-hours-between-shifts: ${SCHEDULING_MIN_REST_HOURS:11}
    maximum-shift-hours-per-day: ${SCHEDULING_MAX_HOURS_PER_DAY:10}
    maximum-consecutive-work-days: ${SCHEDULING_MAX_CONSECUTIVE_DAYS:6}
    solver-seconds-spent-limit: ${SCHEDULING_SOLVER_SECONDS:30}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    # correlationId comes from CorrelationIdFilter via MDC; never log secrets/tokens here.
    level: "%5p [%X{correlationId:-none}]"
