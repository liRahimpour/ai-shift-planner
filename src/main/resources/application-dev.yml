spring:
  jpa:
    show-sql: true

logging:
  level:
    com.aishiftplanner: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true

app:
  # Off unless explicitly enabled, even in dev: a seeder that runs by default is one
  # configuration mistake away from inventing staff in a real database.
  seed-demo-data: ${SEED_DEMO_DATA:false}
